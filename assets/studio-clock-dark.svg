<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 210" width="290" height="210">
  <rect width="290" height="210" rx="20" fill="#13141a" stroke="#262833" stroke-width="1.5"/>

  <!-- Top Status -->
  <circle cx="28" cy="28" r="4" fill="#34d399">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="32" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#9ea4b8">
    WITA · UTC+08:00
  </text>

  <!-- Animated Studio Dial -->
  <circle cx="145" cy="108" r="54" fill="#1a1c24" stroke="#2b2e3d" stroke-width="2"/>
  <circle cx="145" cy="108" r="46" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="4 6"/>
  <!-- Hour / Minute Marks -->
  <line x1="145" y1="58" x2="145" y2="65" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="151" x2="145" y2="158" stroke="#4b5166" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="108" x2="102" y2="108" stroke="#4b5166" stroke-width="2" stroke-linecap="round"/>
  <line x1="188" y1="108" x2="195" y2="108" stroke="#4b5166" stroke-width="2" stroke-linecap="round"/>

  <!-- Static Hour/Min Hands -->
  <line x1="145" y1="108" x2="128" y2="90" stroke="#f4f4f8" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="108" x2="168" y2="88" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Sweeping Second Hand -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 145 108" to="360 145 108" dur="12s" repeatCount="indefinite"/>
    <line x1="145" y1="116" x2="145" y2="66" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="145,62 148,66 145,70 142,66" fill="#f472b6"/>
  </g>
  <circle cx="145" cy="108" r="4" fill="#f4f4f8"/>

  <text x="145" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#6e7489">
    STUDIO DIAL · ACTIVE
  </text>
</svg>
