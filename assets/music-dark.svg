<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 142" width="340" height="142">
  <rect width="340" height="142" rx="20" fill="#16171d" stroke="#282a36" stroke-width="1.5"/>
  <!-- Spinning Vinyl Record -->
  <rect x="20" y="20" width="54" height="54" rx="14" fill="#252236"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 47 47" to="360 47 47" dur="6s" repeatCount="indefinite"/>
    <circle cx="47" cy="47" r="18" fill="#16171d" stroke="#ff9e7d" stroke-width="2"/>
    <path d="M47 32a15 15 0 0 1 13 7.5" fill="none" stroke="#b4a7ff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="47" cy="47" r="4" fill="#b4a7ff"/>
  </g>

  <text x="86" y="36" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a6da95" letter-spacing="0.5">
    NOW PLAYING · 02:14
  </text>
  <text x="86" y="55" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f3f4f8">
    Late Night Lo-fi
  </text>
  <text x="86" y="72" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3b8">
    via ytm-rs
  </text>

  <!-- Looping Progress & Equalizer -->
  <rect x="20" y="94" width="300" height="28" rx="14" fill="#21232d"/>
  <rect x="34" y="106" width="210" height="4" rx="2" fill="#2f3241"/>
  <rect x="34" y="106" width="60" height="4" rx="2" fill="#ff9e7d">
    <animate attributeName="width" values="30;210;30" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="280" y="103" width="3" height="10" rx="1.5" fill="#ff9e7d">
    <animate attributeName="height" values="4;12;6;10;4" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="110;102;108;104;110" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="287" y="101" width="3" height="14" rx="1.5" fill="#b4a7ff">
    <animate attributeName="height" values="12;4;14;6;12" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="102;110;100;108;102" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="294" y="104" width="3" height="8" rx="1.5" fill="#a6da95">
    <animate attributeName="height" values="6;13;4;10;6" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="108;101;110;104;108" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
