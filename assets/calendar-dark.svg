<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 212" width="850" height="212">
  <rect width="850" height="212" rx="22" fill="#16171d" stroke="#282a36" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="34" cy="34" r="13" fill="#252236"/>
  <rect x="27" y="27" width="14" height="14" rx="3" fill="none" stroke="#ff9e7d" stroke-width="1.8"/>
  <path d="M27 32h14" stroke="#ff9e7d" stroke-width="1.5"/>
  <text x="56" y="39" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f3f4f8">
    Activity &amp; Streak
  </text>

  <!-- Left 2x2 Stat Tiles -->
  <rect x="22" y="60" width="190" height="62" rx="14" fill="#21232d"/>
  <text x="38" y="88" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ff9e7d">
    14d
  </text>
  <text x="38" y="108" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#9ca3b8">
    Current streak
  </text>

  <rect x="222" y="60" width="190" height="62" rx="14" fill="#21232d"/>
  <text x="238" y="88" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f3f4f8">
    Rust
  </text>
  <text x="238" y="108" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#9ca3b8">
    Top language
  </text>

  <rect x="22" y="130" width="190" height="62" rx="14" fill="#21232d"/>
  <text x="38" y="158" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#b4a7ff">
    ytm-rs
  </text>
  <text x="38" y="178" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#9ca3b8">
    Main focus
  </text>

  <rect x="222" y="130" width="190" height="62" rx="14" fill="#272438" stroke="#b4a7ff" stroke-opacity="0.35"/>
  <text x="238" y="158" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f3f4f8">
    24/7
  </text>
  <text x="238" y="178" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#c7bce8">
    Cozy coding timer
  </text>

  <!-- Right: Animated 21-Day Calendar Grid -->
  <text x="442" y="54" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#9ca3b8">
    Last 21 days
  </text>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6f768c" text-anchor="middle">
    <text x="466" y="72">M</text><text x="518" y="72">T</text><text x="570" y="72">W</text>
    <text x="622" y="72">T</text><text x="674" y="72">F</text><text x="726" y="72">S</text><text x="778" y="72">S</text>
  </g>

  <!-- Row 1 -->
  <rect x="444" y="82" width="44" height="32" rx="9" fill="#21232d"/><text x="466" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3b8">5</text>
  <rect x="496" y="82" width="44" height="32" rx="9" fill="#3a2f4d"><animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.1s" repeatCount="indefinite"/></rect><text x="518" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6e1f5">6</text>
  <rect x="548" y="82" width="44" height="32" rx="9" fill="#5c4c80"><animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect><text x="570" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">7</text>
  <rect x="600" y="82" width="44" height="32" rx="9" fill="#21232d"/><text x="622" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9ca3b8">8</text>
  <rect x="652" y="82" width="44" height="32" rx="9" fill="#b4a7ff"><animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect><text x="674" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">9</text>
  <rect x="704" y="82" width="44" height="32" rx="9" fill="#5c4c80"/><text x="726" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">10</text>
  <rect x="756" y="82" width="44" height="32" rx="9" fill="#3a2f4d"/><text x="778" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6e1f5">11</text>

  <!-- Row 2 -->
  <rect x="444" y="120" width="44" height="32" rx="9" fill="#b4a7ff"><animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect><text x="466" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">12</text>
  <rect x="496" y="120" width="44" height="32" rx="9" fill="#ff9e7d"><animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect><text x="518" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">13</text>
  <rect x="548" y="120" width="44" height="32" rx="9" fill="#5c4c80"/><text x="570" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">14</text>
  <rect x="600" y="120" width="44" height="32" rx="9" fill="#b4a7ff"/><text x="622" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">15</text>
  <rect x="652" y="120" width="44" height="32" rx="9" fill="#3a2f4d"/><text x="674" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6e1f5">16</text>
  <rect x="704" y="120" width="44" height="32" rx="9" fill="#ff9e7d"/><text x="726" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">17</text>
  <rect x="756" y="120" width="44" height="32" rx="9" fill="#5c4c80"/><text x="778" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">18</text>

  <!-- Row 3 -->
  <rect x="444" y="158" width="44" height="32" rx="9" fill="#3a2f4d"/><text x="466" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6e1f5">19</text>
  <rect x="496" y="158" width="44" height="32" rx="9" fill="#b4a7ff"/><text x="518" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">20</text>
  <rect x="548" y="158" width="44" height="32" rx="9" fill="#ff9e7d"/><text x="570" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">21</text>
  <rect x="600" y="158" width="44" height="32" rx="9" fill="#5c4c80"/><text x="622" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">22</text>
  <rect x="652" y="158" width="44" height="32" rx="9" fill="#b4a7ff"/><text x="674" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">23</text>
  <rect x="704" y="158" width="44" height="32" rx="9" fill="#ff9e7d"/><text x="726" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#16171d">24</text>
  <!-- Pulsing Today Cell -->
  <rect x="756" y="158" width="44" height="32" rx="9" fill="#272438" stroke="#ff9e7d" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="778" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ff9e7d">25</text>
</svg>
