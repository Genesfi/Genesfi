<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220">
  <defs>
    <radialGradient id="aura1" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ff9e7d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#16171d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#b4a7ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#16171d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect width="850" height="220" rx="22"/></clipPath>
    <clipPath id="avatarClip"><rect x="642" y="34" width="152" height="152" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="850" height="220" fill="#16171d"/>
    <rect width="850" height="220" fill="url(#aura1)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="850" height="220" fill="url(#aura2)"/>
    <rect x="0.75" y="0.75" width="848.5" height="218.5" rx="21.5" fill="none" stroke="#282a36" stroke-width="1.5"/>

    <!-- Floating Sparkle Stars -->
    <path d="M540 34l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ff9e7d" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 540 45" to="360 540 45" dur="14s" repeatCount="indefinite"/>
    </path>
    <circle cx="585" cy="70" r="3" fill="#b4a7ff" opacity="0.5">
      <animate attributeName="cy" values="70;62;70" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Left Typography with Blinking Cursor -->
    <text x="44" y="64" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ff9e7d">
      Hi, I'm
    </text>
    <text x="42" y="114" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#f3f4f8" letter-spacing="-1.5">
      Genesfi
    </text>
    <text x="44" y="144" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#9ca3b8">
      crafting native desktop apps &amp; cozy software
    </text>
    <rect x="348" y="131" width="2.5" height="16" rx="1" fill="#ff9e7d">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Status Pills with Pulsing Dot -->
    <rect x="44" y="164" width="112" height="28" rx="14" fill="#21232d" stroke="#2f3241"/>
    <circle cx="62" cy="178" r="4" fill="#ff9e7d">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="74" y="182" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#d8dce8">
      Rustacean
    </text>

    <rect x="166" y="164" width="136" height="28" rx="14" fill="#21232d" stroke="#2f3241"/>
    <circle cx="184" cy="178" r="4" fill="#b4a7ff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="196" y="182" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#d8dce8">
      ytm-rs contributor
    </text>

    <!-- Right Floating Layered Avatar -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="4s" repeatCount="indefinite"/>
      <rect x="652" y="42" width="152" height="152" rx="28" fill="#232531" stroke="#323546" transform="rotate(4 728 118)"/>
      <g clip-path="url(#avatarClip)">
        <rect x="642" y="34" width="152" height="152" fill="#21232e"/>
        <circle cx="718" cy="110" r="68" fill="#2c293e"/>
        <circle cx="718" cy="96" r="28" fill="#f5e0dc"/>
        <path d="M674,174 C674,142 762,142 762,174" fill="#b4a7ff"/>
        <path d="M688,92 C688,66 748,66 748,92 C740,80 696,80 688,92 Z" fill="#1b1926"/>
        <path d="M686,98 C686,74 750,74 750,98" fill="none" stroke="#ff9e7d" stroke-width="5" stroke-linecap="round"/>
        <rect x="680" y="92" width="10" height="20" rx="5" fill="#ff9e7d"/>
        <rect x="746" y="92" width="10" height="20" rx="5" fill="#ff9e7d"/>
      </g>
      <rect x="642" y="34" width="152" height="152" rx="28" fill="none" stroke="#ff9e7d" stroke-opacity="0.45" stroke-width="2"/>
    </g>
  </g>
</svg>
